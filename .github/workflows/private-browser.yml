name: Private browser session

on:
  workflow_dispatch:
    inputs:
      start_url:
        description: Page to open when Chrome starts
        required: false
        default: https://www.currys.co.uk/
        type: string
      duration_minutes:
        description: Session length from 15 to 300 minutes
        required: false
        default: '60'
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: private-browser-session
  cancel-in-progress: true

jobs:
  desktop:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[browser]'))
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DISPLAY: ':99'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve and validate session settings
        id: settings
        shell: bash
        env:
          MANUAL_START_URL: ${{ inputs.start_url }}
          MANUAL_DURATION: ${{ inputs.duration_minutes }}
        run: |
          set -euo pipefail
          start_url="${MANUAL_START_URL:-https://www.currys.co.uk/}"
          duration="${MANUAL_DURATION:-60}"
          issue_number=""

          if [[ "$GITHUB_EVENT_NAME" == "issues" ]]; then
            issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
            body="$(jq -r '.issue.body // "{}"' "$GITHUB_EVENT_PATH")"
            start_url="$(jq -er 'fromjson | .startUrl // "https://www.currys.co.uk/"' <<<"$body")"
            duration="$(jq -er 'fromjson | .durationMinutes // 60 | tostring' <<<"$body")"
          fi

          [[ "$start_url" =~ ^https?://[^[:space:]]+$ ]] || {
            echo "startUrl must be a single http or https URL" >&2
            exit 1
          }
          [[ "$duration" =~ ^[0-9]+$ ]] || {
            echo "durationMinutes must be an integer" >&2
            exit 1
          }
          (( duration >= 15 && duration <= 300 )) || {
            echo "durationMinutes must be between 15 and 300" >&2
            exit 1
          }

          echo "start_url=$start_url" >> "$GITHUB_OUTPUT"
          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Confirm tunnel token is configured
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_TUNNEL_TOKEN" || {
            echo "Add CLOUDFLARE_TUNNEL_TOKEN as a repository Actions secret." >&2
            exit 1
          }

      - name: Install Chromium and desktop components
        run: |
          npm install
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb openbox x11vnc novnc websockify

      - name: Install cloudflared
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Start virtual desktop and Chrome
        shell: bash
        env:
          START_URL: ${{ steps.settings.outputs.start_url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/private-browser /tmp/novnc
          cp -R /usr/share/novnc/. /tmp/novnc/
          cat > /tmp/novnc/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <title>LaptopValue private browser</title>
            </head>
            <body>
              <p>Opening the private browser…</p>
              <script>
                location.replace('/vnc.html?autoconnect=1&resize=remote&path=websockify');
              </script>
            </body>
          </html>
          HTML

          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp -ac \
            > /tmp/private-browser/xvfb.log 2>&1 &
          sleep 2
          openbox-session > /tmp/private-browser/openbox.log 2>&1 &
          x11vnc -display :99 -localhost -forever -shared -nopw -rfbport 5900 \
            -o /tmp/private-browser/x11vnc.log &
          websockify --web=/tmp/novnc 6080 localhost:5900 \
            > /tmp/private-browser/websockify.log 2>&1 &
          node scripts/launch-private-browser.mjs "$START_URL" \
            > /tmp/private-browser/chrome.log 2>&1 &

          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:6080/ > /dev/null && exit 0
            sleep 1
          done
          echo "noVNC did not become ready" >&2
          exit 1

      - name: Connect privatebrowser.laptopvalue.co.uk
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARE_TUNNEL_TOKEN" \
            > /tmp/private-browser/cloudflared.log 2>&1 &
          echo $! > /tmp/private-browser/cloudflared.pid
          sleep 8
          kill -0 "$(cat /tmp/private-browser/cloudflared.pid)" || {
            cat /tmp/private-browser/cloudflared.log >&2
            exit 1
          }

      - name: Announce issue-started session
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.settings.outputs.issue_number }}
          DURATION: ${{ steps.settings.outputs.duration }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="The private Chrome session is starting at https://privatebrowser.laptopvalue.co.uk and will remain available for up to ${DURATION} minutes. Cloudflare Access authentication is required."

      - name: Keep browser session available
        env:
          DURATION: ${{ steps.settings.outputs.duration }}
        run: sleep "$((DURATION * 60))"

      - name: Close issue-started session request
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.settings.outputs.issue_number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="The private browser session has ended."
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            -f state=closed

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-browser-logs-${{ github.run_id }}
          path: /tmp/private-browser/
          if-no-files-found: warn
          retention-days: 7
