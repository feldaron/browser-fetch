name: Bootstrap browser fetch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Extract repository files
        shell: bash
        run: |
          cat <<'ARCHIVE' | base64 -d | tar -xz
          
          ARCHIVE
          rm .github/workflows/bootstrap.yml
      - name: Commit generated repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Playwright browser fetch service"
          git push
