name: Fetch one product price

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Product URL
        required: true
        type: string
      retailer:
        description: Retailer name
        required: false
        type: string
      target_id:
        description: Catalogue record ID
        required: false
        type: string
      expected_sku:
        description: Exact expected SKU
        required: false
        type: string
      expected_ean:
        description: Exact expected EAN
        required: false
        type: string

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Fetch product
        run: npm run fetch:one
        env:
          TARGET_URL: ${{ inputs.target_url }}
          RETAILER: ${{ inputs.retailer }}
          TARGET_ID: ${{ inputs.target_id }}
          EXPECTED_SKU: ${{ inputs.expected_sku }}
          EXPECTED_EAN: ${{ inputs.expected_ean }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TABLE: ${{ vars.SUPABASE_TABLE }}
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-price-evidence-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
